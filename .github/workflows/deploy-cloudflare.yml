name: Probar y publicar en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modular-3d-cloudflare-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 7ce0859d509e787aa4d2bde8742e3888
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_NAME: modular-3d-platform
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: node --test test/*.test.js

      - name: Comprobar el token
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Falta el secreto CLOUDFLARE_API_TOKEN en GitHub." >&2
            exit 1
          }

      - name: Localizar o crear la base D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$D1_DATABASE_NAME")"
          database_id="$(node -e 'const r=JSON.parse(process.argv[1]); const d=(r.result||[]).find(x=>x.name===process.env.D1_DATABASE_NAME); if(d) process.stdout.write(d.uuid)' "$response")"
          if [ -z "$database_id" ]; then
            response="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$D1_DATABASE_NAME\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
            database_id="$(node -e 'const r=JSON.parse(process.argv[1]); if(!r.success) process.exit(1); process.stdout.write(r.result.uuid)' "$response")"
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Generar configuración de producción
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: node scripts/make-ci-wrangler-config.mjs

      - name: Aplicar estructura D1
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler.ci.json

      - name: Configurar firma interna de sesiones
        shell: bash
        run: |
          set -euo pipefail
          session_secret="$(printf '%s' "$CLOUDFLARE_API_TOKEN:modular3d-session-v1" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$session_secret" | npx wrangler secret put MODULAR3D_TOKEN_SECRET --config wrangler.ci.json

      - name: Publicar Worker
        run: npx wrangler deploy --config wrangler.ci.json
