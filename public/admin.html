<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MODULAR-3D · Panel maestro</title>
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/admin-v2.css">
</head>
<body>
  <section id="login" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="brand"><span>◇</span> MODULAR-3D</div>
      <p class="eyebrow">CUENTA MAESTRA</p>
      <h1>Control de productos</h1>
      <p class="muted">Administra todas las licencias y proyectos desde un solo lugar.</p>
      <label>Correo administrativo<input name="email" type="email" value="desarrollo@modular-3d.com" required autocomplete="username"></label>
      <label>Contraseña<input name="password" type="password" minlength="10" required autocomplete="current-password"></label>
      <button type="submit">Ingresar al panel</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <div id="app" class="app hidden">
    <aside>
      <div class="brand"><span>◇</span> MODULAR-3D</div>
      <p class="eyebrow">PLATAFORMA CENTRAL</p>
      <nav>
        <button data-view="overview" class="active">Resumen</button>
        <button data-view="products">Productos</button>
        <button data-view="licenses">Licencias</button>
        <button data-view="projects">Proyectos</button>
        <button data-view="devices">Dispositivos</button>
        <button data-view="releases">Versiones RBZ</button>
        <button data-view="audit">Auditoría</button>
      </nav>
      <div class="aside-foot"><span id="admin-email"></span><button id="logout" class="ghost">Cerrar sesión</button></div>
    </aside>
    <main>
      <header><div><p class="eyebrow">PANEL MAESTRO</p><h1 id="title">Resumen</h1></div><button id="refresh" class="secondary">Actualizar</button></header>
      <div id="notice" class="notice hidden"></div>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="user-dialog">
    <form id="user-form" method="dialog">
      <div class="dialog-head"><h2 id="user-dialog-title">Nuevo usuario</h2><button type="button" data-close aria-label="Cerrar">×</button></div>
      <input name="id" type="hidden">
      <div class="form-grid">
        <label>Nombre<input name="name" required></label>
        <label>Correo<input name="email" type="email" required></label>
        <div class="wide password-control">
          <label class="password-choice"><input id="change-password" name="change_password" type="checkbox"> <span>Cambiar contraseña compartida</span></label>
          <label id="password-field">Nueva contraseña<input name="password" type="password" minlength="10" autocomplete="new-password" disabled><small id="password-help">Activa la opción para establecer una contraseña nueva en todos los productos.</small></label>
        </div>
      </div>
      <h3 class="products-title">Productos y vigencia individual</h3>
      <div id="user-products" class="product-editor"></div>
      <div class="actions"><button type="button" class="secondary" data-close>Cancelar</button><button type="submit">Guardar usuario</button></div>
    </form>
  </dialog>
  <dialog id="product-dialog">
    <form id="product-form" method="dialog">
      <div class="dialog-head"><h2 id="product-dialog-title">Nuevo producto</h2><button type="button" data-product-close aria-label="Cerrar">×</button></div>
      <input name="id" type="hidden">
      <div class="form-grid">
        <label>Código interno<input name="code" required pattern="[a-z0-9_\-]+" placeholder="mi_producto"></label>
        <label>Tipo<select name="product_type"><option value="web">Aplicación web</option><option value="plugin">Plugin</option></select></label>
        <label class="wide">Nombre comercial<input name="name" required placeholder="Nombre del producto"></label>
        <label class="wide">Descripción<input name="description" placeholder="Descripción breve"></label>
        <label class="wide">Enlace directo<input name="launch_url" type="url" placeholder="https://..."><small>Para abrir aplicaciones web.</small></label>
        <label class="wide">Enlace de descarga<input name="download_url" type="url" placeholder="https://..."><small>Opcional. Los plugins MODULAR-3D pueden usar automáticamente la última versión RBZ.</small></label>
        <label class="wide">Repositorio<input name="repository_url" type="url" placeholder="https://github.com/..."></label>
        <label>Orden<input name="sort_order" type="number" min="0" max="9999" value="100"></label>
        <label>Estado<select name="active"><option value="1">Activo</option><option value="0">Oculto</option></select></label>
      </div>
      <div class="actions"><button type="button" class="secondary" data-product-close>Cancelar</button><button type="submit">Guardar producto</button></div>
    </form>
  </dialog>
  <script type="module" src="/admin.js"></script>
</body>
</html>
